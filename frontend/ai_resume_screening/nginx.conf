server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the React app — support client-side routing (React Router-style paths)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy any /api/* request to the backend container/service
    # NOTE: "backend" here is a DNS name. In plain `docker run` it must match
    # a container name on the same Docker network (we'll create that network).
    # In Kubernetes later, it'll match a Service name instead — no code changes needed.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resume file uploads can be large — raise the limit (default is 1MB)
        client_max_body_size 20M;
    }

    # Basic gzip for faster static asset delivery
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
