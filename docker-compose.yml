services:
  backend:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    networks:
      - resume-app-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/ai_resume_screening
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - resume-app-net
    restart: unless-stopped

networks:
  resume-app-net:
    driver: bridge
