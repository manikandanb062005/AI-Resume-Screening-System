name: CI - Test and Build Backend

# Trigger on every push to main, and on pull requests targeting main
on:
  push:
    branches: [main]
    paths:
      - 'ml-model/**'              # only run when backend code actually changes
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml-model/**'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-model

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model (required before tests - routes.py loads model.pkl at import time)
        run: python train.py

      - name: Run tests
        run: pytest -v

  build-and-push:
    name: Build and Push Docker Image
    needs: test                     # only runs if the test job succeeds
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # only push images on actual pushes to main, not PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-model
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/resume-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
